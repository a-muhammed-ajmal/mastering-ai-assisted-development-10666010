<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Animal Herd Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100vh;
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      font-size: 14px;
      z-index: 10;
    }

    #ui-container h2 {
      margin-bottom: 15px;
      font-size: 18px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    #animalCountSlider {
      width: 150px;
      cursor: pointer;
    }

    #animalCountDisplay {
      min-width: 40px;
      font-weight: bold;
      color: #ff6b6b;
    }

    .stats {
      margin-top: 15px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.6;
    }

    .stats-label {
      color: #ffb347;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <h2>Animal Herd Simulation</h2>
    <div class="slider-container">
      <label for="animalCountSlider">Animals:</label>
      <input type="range" id="animalCountSlider" min="1" max="50" value="15">
      <span id="animalCountDisplay">15</span>
    </div>
    <div class="stats">
      <div><span class="stats-label">FPS:</span> <span id="fps">60</span></div>
      <div><span class="stats-label">Animals:</span> <span id="stat-animals">15</span></div>
      <div><span class="stats-label">Particles:</span> <span id="stat-particles">0</span></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ============== SCENE SETUP ==============
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowShadowMap;
    document.body.appendChild(renderer.domElement);

    // ============== LIGHTING ==============
    // Sunset sky gradient
    const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
    const skyMaterial = new THREE.MeshBasicMaterial({
      color: 0xff9800,
      side: THREE.BackSide
    });
    const skyMesh = new THREE.Mesh(skyGeometry, skyMaterial);
    scene.add(skyMesh);

    // Directional light (sun)
    const sunLight = new THREE.DirectionalLight(0xfdb813, 1.5);
    sunLight.position.set(100, 100, 50);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.far = 500;
    sunLight.shadow.camera.left = -200;
    sunLight.shadow.camera.right = 200;
    sunLight.shadow.camera.top = 200;
    sunLight.shadow.camera.bottom = -200;
    scene.add(sunLight);

    // Ambient light
    const ambientLight = new THREE.AmbientLight(0xff6b35, 0.6);
    scene.add(ambientLight);

    // ============== TERRAIN ==============
    const terrainGeometry = new THREE.PlaneGeometry(500, 500, 100, 100);
    const terrainMaterial = new THREE.MeshStandardMaterial({
      color: 0xc2a878,
      roughness: 0.8,
      metalness: 0
    });

    // Add some noise to terrain
    const positionAttribute = terrainGeometry.getAttribute('position');
    const posArray = positionAttribute.array;
    for (let i = 2; i < posArray.length; i += 3) {
      posArray[i] = Math.random() * 3;
    }
    positionAttribute.needsUpdate = true;

    const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
    terrain.rotation.x = -Math.PI / 2;
    terrain.receiveShadow = true;
    scene.add(terrain);

    // ============== ANIMALS ==============
    const animals = [];
    const animalSpeed = 0.5;
    const turnSpeed = 0.02;

    function createAnimal() {
      // Create a stylized animal from basic geometries
      const group = new THREE.Group();

      // Body (cylinder)
      const bodyGeometry = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 8);
      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b4513,
        roughness: 0.7
      });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      body.position.y = 1.5;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Head (sphere)
      const headGeometry = new THREE.SphereGeometry(0.6, 8, 8);
      const headMaterial = new THREE.MeshStandardMaterial({
        color: 0xa0522d,
        roughness: 0.7
      });
      const head = new THREE.Mesh(headGeometry, headMaterial);
      head.position.set(0, 2.8, -1.5);
      head.castShadow = true;
      head.receiveShadow = true;
      group.add(head);

      // Legs (4 cylinders)
      const legGeometry = new THREE.CylinderGeometry(0.25, 0.25, 1.8, 6);
      const legMaterial = new THREE.MeshStandardMaterial({
        color: 0x654321,
        roughness: 0.6
      });

      const legPositions = [
        { x: -0.5, z: 0.5 },
        { x: 0.5, z: 0.5 },
        { x: -0.5, z: -0.5 },
        { x: 0.5, z: -0.5 }
      ];

      legPositions.forEach(pos => {
        const leg = new THREE.Mesh(legGeometry, legMaterial);
        leg.position.set(pos.x, 0.9, pos.z);
        leg.castShadow = true;
        leg.receiveShadow = true;
        group.add(leg);
      });

      // Ears (small boxes)
      const earGeometry = new THREE.BoxGeometry(0.3, 0.6, 0.2);
      const earMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b4513,
        roughness: 0.7
      });

      const leftEar = new THREE.Mesh(earGeometry, earMaterial);
      leftEar.position.set(-0.4, 3.2, -1.2);
      leftEar.rotation.z = 0.3;
      leftEar.castShadow = true;
      group.add(leftEar);

      const rightEar = new THREE.Mesh(earGeometry, earMaterial);
      rightEar.position.set(0.4, 3.2, -1.2);
      rightEar.rotation.z = -0.3;
      rightEar.castShadow = true;
      group.add(rightEar);

      // Position randomly on terrain
      const x = (Math.random() - 0.5) * 300;
      const z = (Math.random() - 0.5) * 300;
      group.position.set(x, 0, z);

      scene.add(group);

      return {
        mesh: group,
        vx: (Math.random() - 0.5) * 0.3,
        vz: (Math.random() - 0.5) * 0.3,
        directionChangeTimer: Math.random() * 300 + 180
      };
    }

    function updateAnimalCount(count) {
      // Remove excess animals
      while (animals.length > count) {
        const animal = animals.pop();
        scene.remove(animal.mesh);
      }

      // Add new animals
      while (animals.length < count) {
        animals.push(createAnimal());
      }

      document.getElementById('stat-animals').textContent = count;
    }

    // ============== PARTICLE SYSTEM ==============
    const particles = [];
    const maxParticles = 500;

    function createDustParticles(position, count = 5) {
      for (let i = 0; i < count; i++) {
        const geometry = new THREE.SphereGeometry(0.1, 4, 4);
        const material = new THREE.MeshBasicMaterial({
          color: 0xd4a574,
          transparent: true,
          opacity: 0.6
        });
        const particle = new THREE.Mesh(geometry, material);
        particle.position.copy(position);
        particle.position.y += Math.random() * 0.5;
        scene.add(particle);

        particles.push({
          mesh: particle,
          vx: (Math.random() - 0.5) * 0.15,
          vy: Math.random() * 0.2,
          vz: (Math.random() - 0.5) * 0.15,
          life: 1.0,
          maxLife: 1.0
        });

        if (particles.length > maxParticles) {
          const oldParticle = particles.shift();
          scene.remove(oldParticle.mesh);
        }
      }
    }

    // ============== CAMERA ==============
    let cameraTargetX = 0;
    let cameraTargetZ = 30;
    const cameraDistance = 80;

    function updateCamera() {
      // Camera focuses on herd center
      if (animals.length > 0) {
        let centerX = 0, centerZ = 0;
        animals.forEach(a => {
          centerX += a.mesh.position.x;
          centerZ += a.mesh.position.z;
        });
        centerX /= animals.length;
        centerZ /= animals.length;

        cameraTargetX = centerX;
        cameraTargetZ = centerZ;
      }

      // Smooth camera follow
      camera.position.x += (cameraTargetX - 30 - camera.position.x) * 0.02;
      camera.position.z += (cameraTargetZ + cameraDistance - camera.position.z) * 0.02;
      camera.position.y = 40;

      camera.lookAt(cameraTargetX, 5, cameraTargetZ);
    }

    // ============== ANIMATION LOOP ==============
    const clock = new THREE.Clock();
    let frameCount = 0;
    let fpsTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      const deltaTime = clock.getDelta();
      fpsTimer += deltaTime;
      frameCount++;

      if (fpsTimer >= 1) {
        document.getElementById('fps').textContent = frameCount;
        frameCount = 0;
        fpsTimer = 0;
      }

      // Update animals
      animals.forEach(animal => {
        // Movement
        animal.mesh.position.x += animal.vx * animalSpeed;
        animal.mesh.position.z += animal.vz * animalSpeed;

        // Herd behavior - move towards center
        let centerX = 0, centerZ = 0;
        animals.forEach(a => {
          centerX += a.mesh.position.x;
          centerZ += a.mesh.position.z;
        });
        centerX /= animals.length;
        centerZ /= animals.length;

        const towardsCenterX = centerX - animal.mesh.position.x;
        const towardsCenterZ = centerZ - animal.mesh.position.z;
        const distToCenter = Math.sqrt(towardsCenterX * towardsCenterX + towardsCenterZ * towardsCenterZ);

        if (distToCenter > 100) {
          animal.vx += (towardsCenterX / distToCenter) * 0.01;
          animal.vz += (towardsCenterZ / distToCenter) * 0.01;
        }

        // Direction change
        animal.directionChangeTimer--;
        if (animal.directionChangeTimer <= 0) {
          animal.vx = (Math.random() - 0.5) * 0.5;
          animal.vz = (Math.random() - 0.5) * 0.5;
          animal.directionChangeTimer = Math.random() * 300 + 180;
        }

        // Speed limit
        const speed = Math.sqrt(animal.vx * animal.vx + animal.vz * animal.vz);
        if (speed > 0.5) {
          animal.vx = (animal.vx / speed) * 0.5;
          animal.vz = (animal.vz / speed) * 0.5;
        }

        // Rotate to face direction
        if (speed > 0.01) {
          animal.mesh.rotation.y = Math.atan2(animal.vx, animal.vz);
        }

        // Dust particles when moving
        if (speed > 0.05 && Math.random() < 0.3) {
          createDustParticles(animal.mesh.position, 1);
        }

        // Bounce off boundaries
        if (Math.abs(animal.mesh.position.x) > 250) {
          animal.vx *= -0.5;
        }
        if (Math.abs(animal.mesh.position.z) > 250) {
          animal.vz *= -0.5;
        }
      });

      // Update particles
      particles.forEach((particle, index) => {
        particle.mesh.position.x += particle.vx;
        particle.mesh.position.y += particle.vy;
        particle.mesh.position.z += particle.vz;

        particle.life -= 0.01;
        particle.mesh.material.opacity = (particle.life / particle.maxLife) * 0.6;

        if (particle.life <= 0) {
          scene.remove(particle.mesh);
          particles.splice(index, 1);
        }
      });

      document.getElementById('stat-particles').textContent = particles.length;

      // Update camera
      updateCamera();

      // Update sky gradient
      const sunAngle = (Date.now() % 100000) / 100000;
      const skyColor = new THREE.Color();
      skyColor.setHSL(0.08 - sunAngle * 0.1, 0.8, 0.55 - sunAngle * 0.2);
      skyMesh.material.color.copy(skyColor);

      // Render
      renderer.render(scene, camera);
    }

    // ============== EVENT LISTENERS ==============
    const slider = document.getElementById('animalCountSlider');
    const display = document.getElementById('animalCountDisplay');

    slider.addEventListener('input', (e) => {
      const count = parseInt(e.target.value);
      display.textContent = count;
      updateAnimalCount(count);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============== INITIALIZATION ==============
    updateAnimalCount(15);
    animate();
  </script>
</body>
</html>
