# GitHub Actions Workflow for Linting
#
# This workflow demonstrates code quality checks.
# TODO: Build out this workflow to:
# - Run TypeScript compiler
# - Run linter (ESLint)
# - Fail build if errors found

name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

