<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro-Futuristic Music Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="visualizer-container"></div>
    
    <div id="ui-overlay" class="fade-in">
        <div class="header">
            <h1>SONIC <span class="accent">VISION</span></h1>
            <div class="fps-counter">FPS: <span id="fps">60</span></div>
        </div>
        
        <div class="controls-panel">
            <div class="control-group">
                <label for="song-select">TRACK SELECT</label>
                <div class="select-wrapper">
                    <select id="song-select">
                        <option value="music/flying.mp3">Flying</option>
                        <option value="music/immortal.mp3">Immortal</option>
                        <option value="music/meet.mp3">Meet</option>
                        <option value="custom">Load Custom File...</option>
                    </select>
                </div>
                <input type="file" id="file-input" accept="audio/*" style="display: none;">
            </div>

            <div class="control-group">
                <label for="shader-select">VISUALIZER MODE</label>
                <div class="select-wrapper">
                    <select id="shader-select">
                        <!-- Options will be populated by JS -->
                    </select>
                </div>
            </div>

            <div class="playback-controls">
                <button id="play-btn" class="icon-btn" title="Play/Pause">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="volume-control">
                 <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>
        
        <div class="info-panel">
            <p>Use <span class="key">Space</span> to Play/Pause &bull; Drag & Drop files supported</p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
